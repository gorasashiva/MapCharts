<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trade Rain Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Trade Rain — Demo</h1>
      <div class="controls">
        <button id="btn-toggle">Stop</button>
        <label>Rate <span id="rate-val">30</span>: <input id="rate" type="range" min="1" max="200" value="30"></label>
        <label>Volume scale <span id="vscale-val">3</span>: <input id="vscale" type="range" min="1" max="10" value="3"></label>
        <label>Animate: <input id="animate" type="checkbox" checked></label>
      </div>
    </header>
    <main>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </main>
    <footer>
      <p>This is a standalone canvas prototype of the Trade Rain overlay.</p>
    </footer>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
