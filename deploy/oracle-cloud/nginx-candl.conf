server {
    listen 127.0.0.1:8080;
    server_name _;
    root /var/www/candl;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /tape {
        return 404;
    }

    location ^~ /tape/ {
        return 404;
    }

    # MAP V3: recorded GLD option chains from map-recorder.service (502 until it is installed).
    location ^~ /maplevels/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    location = /__buddy {
        return 404;
    }

    location ^~ /__buddy/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
