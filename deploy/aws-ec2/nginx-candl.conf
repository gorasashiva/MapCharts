# Chart site on port 8080 of every interface, so it answers on the public IP.
# Who can reach it is decided by the EC2 security group (only the IPs you add)
# and, optionally, a password (set-password.sh). /tape/ and /maplevels/ go to
# the recorders running here.
server {
    listen 8080;
    server_name _;

    # Password, when set-password.sh has turned it on (no file = no password).
    include /etc/nginx/candl-auth.d/*.conf;
    root /var/www/candl;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Recorded trade tape: footprint history, Big Trades / Deep Trades clusters.
    location ^~ /tape/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # MAP V3: recorded GLD option chains.
    location ^~ /maplevels/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    # Trade Buddy's Claude bridge is development-only; never expose it.
    location ^~ /__buddy {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
