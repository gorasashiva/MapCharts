server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite content-hashes filenames under /assets, so they're safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No API proxy needed. Delta Exchange India serves every public
    # market-data endpoint with `access-control-allow-origin: *` — spot,
    # perpetuals and options alike — and its WebSocket is browser-reachable,
    # so the page calls api.india.delta.exchange directly. (The Binance build
    # of this demo needed an /eapi proxy here, because its options API sends
    # no CORS headers; that block is gone with the provider swap.)

    # Recorded big-trade history from the tape recorder service. Resolved per
    # request through Docker's DNS, so nginx still starts (and the app still
    # works, live-only) when the recorder isn't part of the deployment.
    location /tape/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $tape_upstream http://recorder:8787;
        proxy_pass $tape_upstream;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
